# Rebuilds js/cms.js whenever a calendar card changes (every save in Pages CMS is a commit to content/calendar/),
# then redeploys the site. Run it by hand too: Actions → "Build content" → Run workflow.
name: Build content

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'scripts/build-content.mjs'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-content
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build js/cms.js from content/calendar
        run: node scripts/build-content.mjs

      - name: Commit if anything changed
        id: commit
        run: |
          if [ -z "$(git status --porcelain js/cms.js)" ]; then
            echo "Nothing to rebuild."
            exit 0
          fi
          git config user.name "37degree-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/cms.js
          git commit -m "Build calendar content"
          git pull --rebase
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # pushes made with GITHUB_TOKEN don't always start a Pages build on their own
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.pushed == 'true'
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
        env:
          GH_TOKEN: ${{ github.token }}
